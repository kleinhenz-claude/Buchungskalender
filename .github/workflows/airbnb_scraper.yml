name: Airbnb Scraper

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Ort (z.B. Ostfildern-Scharnhausen)"
        default: "Ostfildern-Scharnhausen"
        required: true
      checkin:
        description: "Check-in (YYYY-MM-DD)"
        default: "2026-05-22"
        required: true
      checkout:
        description: "Check-out (YYYY-MM-DD)"
        default: "2026-05-24"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Scraper ausführen
        run: |
          python airbnb_scraper.py
        env:
          AIRBNB_LOCATION: ${{ github.event.inputs.location }}
          AIRBNB_CHECKIN:  ${{ github.event.inputs.checkin }}
          AIRBNB_CHECKOUT: ${{ github.event.inputs.checkout }}

      - name: CSV-Status prüfen
        run: |
          echo "--- CSV-Datei ---"
          ls -la airbnb_ergebnisse.csv || echo "Datei existiert nicht!"
          echo "--- Inhalt (erste 5 Zeilen) ---"
          head -n 5 airbnb_ergebnisse.csv || true
          echo "--- Zeilenanzahl ---"
          wc -l airbnb_ergebnisse.csv || true

      - name: CSV als Artefakt hochladen
        uses: actions/upload-artifact@v5
        with:
          name: airbnb-ergebnisse
          path: airbnb_ergebnisse.csv
          retention-days: 30

      - name: CSV ins Repository committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add airbnb_ergebnisse.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen — Datei unverändert."
          else
            git commit -m "chore: Airbnb-Ergebnisse aktualisieren (${{ github.event.inputs.location }}, ${{ github.event.inputs.checkin }}–${{ github.event.inputs.checkout }})"
            git push origin HEAD:${{ github.ref_name }}
            echo "CSV committed und gepusht."
          fi
