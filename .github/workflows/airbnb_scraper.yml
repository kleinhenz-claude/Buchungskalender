name: Airbnb Scraper

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Ort (z.B. Ostfildern-Scharnhausen)"
        default: "Ostfildern-Scharnhausen"
        required: true
      checkin:
        description: "Check-in (YYYY-MM-DD)"
        default: "2026-05-22"
        required: true
      checkout:
        description: "Check-out (YYYY-MM-DD)"
        default: "2026-05-24"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Scraper ausführen
        id: scraper
        continue-on-error: true
        run: |
          set +e
          python airbnb_scraper.py 2>&1 | tee scraper_output.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        env:
          AIRBNB_LOCATION: ${{ github.event.inputs.location }}
          AIRBNB_CHECKIN:  ${{ github.event.inputs.checkin }}
          AIRBNB_CHECKOUT: ${{ github.event.inputs.checkout }}

      - name: CSV-Status prüfen
        if: always()
        run: |
          echo "==== Scraper Exit-Code: ${{ steps.scraper.outputs.exit_code }} ===="
          echo ""
          echo "==== Letzte Zeilen der Scraper-Ausgabe ===="
          tail -n 30 scraper_output.log 2>/dev/null || echo "Kein Log vorhanden."
          echo ""
          echo "==== CSV-Datei ===="
          if [ -f airbnb_ergebnisse.csv ]; then
            ls -la airbnb_ergebnisse.csv
            echo "Zeilen: $(wc -l < airbnb_ergebnisse.csv)"
            echo "--- Inhalt ---"
            head -n 10 airbnb_ergebnisse.csv
          else
            echo "Datei existiert nicht — erstelle Platzhalter."
            echo "Titel,Unterzeile,Preis_pro_Nacht,Gesamtpreis,Bewertung,Anzahl_Bewertungen,Superhost,URL" > airbnb_ergebnisse.csv
          fi

      - name: CSV als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: airbnb-ergebnisse
          path: |
            airbnb_ergebnisse.csv
            scraper_output.log
          retention-days: 30

      - name: CSV ins Repository committen
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add airbnb_ergebnisse.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen — Datei unverändert."
          else
            git commit -m "chore: Airbnb-Ergebnisse aktualisieren (${{ github.event.inputs.location }}, ${{ github.event.inputs.checkin }}–${{ github.event.inputs.checkout }})"
            git push origin HEAD:${{ github.ref_name }}
            echo "CSV committed und gepusht."
          fi
