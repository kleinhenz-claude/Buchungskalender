name: Airbnb Scraper

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Ort (z.B. Ostfildern-Scharnhausen)"
        default: "Ostfildern-Scharnhausen"
        required: true
      checkin:
        description: "Check-in (YYYY-MM-DD)"
        default: "2026-05-22"
        required: true
      checkout:
        description: "Check-out (YYYY-MM-DD)"
        default: "2026-05-24"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Scraper ausführen
        run: |
          python airbnb_scraper.py
        env:
          AIRBNB_LOCATION: ${{ github.event.inputs.location }}
          AIRBNB_CHECKIN:  ${{ github.event.inputs.checkin }}
          AIRBNB_CHECKOUT: ${{ github.event.inputs.checkout }}

      - name: CSV als Artefakt hochladen
        uses: actions/upload-artifact@v5
        with:
          name: airbnb-ergebnisse
          path: airbnb_ergebnisse.csv
          retention-days: 30

      - name: CSV ins Repository committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add airbnb_ergebnisse.csv
          git diff --cached --quiet && echo "Keine Änderungen." || \
            git commit -m "chore: Airbnb-Ergebnisse aktualisieren (${{ github.event.inputs.location }}, ${{ github.event.inputs.checkin }}–${{ github.event.inputs.checkout }})"
          git push
