<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airbnb Ergebnisse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F5F2EC;
  --surface: #FDFCFA;
  --surface2: #EDEBE4;
  --accent: #8B5E3C;
  --accent-light: #C4956A;
  --text: #1C1A16;
  --text-muted: #7A7469;
  --text-faint: #B0A99F;
  --border: rgba(28,26,22,0.1);
  --radius: 14px;
  --radius-sm: 7px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}

.hero {
  background: #1C1A16;
  color: var(--bg);
  padding: 3rem 2.5rem 2.75rem;
  position: relative;
  overflow: hidden;
}
.hero-orb1 {
  position: absolute; top: -80px; right: -80px;
  width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(196,149,106,0.18) 0%, transparent 70%);
  pointer-events: none;
}
.hero-orb2 {
  position: absolute; bottom: -50px; left: 60px;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(196,149,106,0.09) 0%, transparent 70%);
  pointer-events: none;
}
.hero-eyebrow {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-light);
  margin-bottom: 0.6rem;
  font-weight: 400;
}
.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 600;
  line-height: 1.08;
  color: var(--bg);
  margin-bottom: 0.4rem;
}
.hero-sub {
  font-size: 13px;
  color: rgba(245,242,236,0.45);
  font-weight: 300;
  font-style: italic;
  margin-bottom: 2.25rem;
}
.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius);
  overflow: hidden;
  max-width: 700px;
}
.hero-stat {
  background: rgba(255,255,255,0.03);
  padding: 1.25rem 1rem;
  text-align: center;
}
.hero-stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 2.1rem;
  font-weight: 600;
  color: var(--accent-light);
  line-height: 1;
  margin-bottom: 5px;
}
.hero-stat-label {
  font-size: 11px;
  color: rgba(245,242,236,0.42);
  letter-spacing: 0.06em;
  font-weight: 400;
}

.main {
  padding: 2.5rem 2.5rem 4rem;
  max-width: 1200px;
  margin: 0 auto;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.25rem;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 14px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.filter-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  align-items: center;
}
.filter-bar input, .filter-bar select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.filter-bar input:focus, .filter-bar select:focus { border-color: var(--accent-light); }
.filter-bar input { min-width: 220px; }
.result-count { margin-left: auto; font-size: 12px; color: var(--text-muted); }

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  margin-bottom: 3rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.3rem;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: box-shadow 0.25s, transform 0.25s;
}
.card:hover { box-shadow: 0 6px 28px rgba(0,0,0,0.08); transform: translateY(-2px); }
.card-title { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 400; color: var(--text); line-height: 1.3; }
.card-sub { font-size: 12px; color: var(--text-muted); }
.card-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 400; border: 1px solid; }
.pill-price  { background: #FEF0E7; color: #7A3E1A; border-color: #D4956A; }
.pill-rating { background: #EEF7EC; color: #2D5A27; border-color: #7AAE74; }
.pill-super  { background: #EEF3FE; color: #1A3A8B; border-color: #7A9ADE; }
.pill-other  { background: var(--surface2); color: var(--text-muted); border-color: var(--border); }
.card-link { font-size: 12px; color: var(--accent); text-decoration: none; margin-top: auto; display: inline-block; font-weight: 400; }
.card-link:hover { text-decoration: underline; }

.table-wrap { overflow-x: auto; margin-bottom: 3rem; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead tr { border-bottom: 1px solid var(--border); }
th { text-align: left; font-size: 11px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-faint); padding: 0 14px 10px 0; white-space: nowrap; }
td { padding: 10px 14px 10px 0; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; max-width: 280px; }
td a { color: var(--accent); text-decoration: none; font-size: 12px; }
td a:hover { text-decoration: underline; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(196,149,106,0.05); }

.state-box { text-align: center; padding: 4rem 2rem; color: var(--text-muted); font-size: 14px; }
.state-box .icon { font-size: 2.5rem; margin-bottom: 1rem; }

.view-toggle { display: flex; gap: 6px; }
.view-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 7px 14px; font-size: 12px; cursor: pointer; color: var(--text-muted);
  font-family: 'DM Sans', sans-serif; transition: background 0.15s, color 0.15s;
}
.view-btn.active { background: var(--accent-light); color: #fff; border-color: var(--accent-light); }

.upload-bar {
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  border: 1px dashed var(--accent-light); border-radius: var(--radius);
  padding: 1rem 1.3rem; margin-bottom: 1.5rem; flex-wrap: wrap;
}
.upload-bar label {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--accent-light); color: #fff; border-radius: var(--radius-sm);
  padding: 7px 16px; font-size: 13px; font-family: 'DM Sans', sans-serif; transition: opacity 0.15s;
}
.upload-bar label:hover { opacity: 0.85; }
.upload-bar input[type=file] { display: none; }
.upload-hint { font-size: 12px; color: var(--text-muted); }

.map-section { margin-bottom: 3rem; }
#map {
  height: 420px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  z-index: 0;
}
.leaflet-popup-content { font-family: 'DM Sans', sans-serif; font-size: 13px; line-height: 1.5; }
.leaflet-popup-content strong { font-weight: 500; }
.leaflet-popup-content a { color: #8B5E3C; }
.map-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

footer { background: #1C1A16; color: rgba(245,242,236,0.32); text-align: center; font-size: 12px; padding: 1.5rem; letter-spacing: 0.05em; }

@media (max-width: 640px) {
  .hero { padding: 2rem 1.25rem 2rem; }
  .main { padding: 1.5rem 1.25rem 3rem; }
  .hero-stats { grid-template-columns: repeat(2,1fr); }
  .hero-stat-val { font-size: 1.6rem; }
  .filter-bar { flex-direction: column; align-items: stretch; }
  .filter-bar input { min-width: unset; width: 100%; }
  .result-count { margin-left: 0; }
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-orb1"></div>
  <div class="hero-orb2"></div>
  <p class="hero-eyebrow">Airbnb · Scraper-Ergebnisse</p>
  <h1>Inserate-Übersicht</h1>
  <p class="hero-sub" id="hero-sub">Lade Daten…</p>
  <div class="hero-stats" id="hero-stats"></div>
</header>

<main class="main">

  <div class="upload-bar">
    <label>
      &#8593; CSV laden
      <input type="file" id="file-input" accept=".csv">
    </label>
    <span class="upload-hint" id="upload-hint">Eigene <code>airbnb_ergebnisse.csv</code> hochladen — oder Seite lädt sie automatisch.</span>
  </div>

  <section class="map-section">
    <h2 class="section-title">Karte</h2>
    <div id="map"></div>
    <p class="map-hint" id="map-hint">Karte wird geladen …</p>
  </section>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:12px;">
    <h2 class="section-title" style="margin-bottom:0;flex:1;">Ergebnisse · Ostfildern</h2>
    <div class="view-toggle">
      <button class="view-btn active" id="btn-cards" onclick="setView('cards')">Karten</button>
      <button class="view-btn" id="btn-table" onclick="setView('table')">Tabelle</button>
    </div>
  </div>

  <div class="filter-bar">
    <input type="search" id="search" placeholder="Suchen …">
    <select id="sort-select">
      <option value="">Sortieren …</option>
      <option value="preis-asc">Preis ↑</option>
      <option value="preis-desc">Preis ↓</option>
      <option value="superhost">Superhost zuerst</option>
    </select>
    <select id="superhost-filter">
      <option value="">Alle</option>
      <option value="ja">Nur Superhost</option>
    </select>
    <span class="result-count" id="result-count"></span>
  </div>

  <div id="cards-view" class="cards-grid"></div>

  <div id="table-view" class="table-wrap" style="display:none;">
    <table>
      <thead><tr id="table-head"></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div id="state-box" class="state-box" style="display:none;"></div>

</main>

<footer id="footer">Airbnb-Scraper · Scharnhäusle 10</footer>

<script>
const CSV_FILE = 'airbnb_ergebnisse.csv';
let allRows = [], currentView = 'cards';

// Karte: Ostfildern-Scharnhausen
const OSTFILDERN = [48.7239, 9.2569];
let map, markers = [], markerLayer;

function initMap() {
  map = L.map('map').setView(OSTFILDERN, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

function updateMap(rows) {
  if (!map) return;
  markerLayer.clearLayers();
  markers = [];
  const hint = document.getElementById('map-hint');
  const toShow = rows.filter(r => r._isOstfildern);

  if (!toShow.length) {
    hint.textContent = 'Keine Ostfildern-Inserate zum Anzeigen.';
    return;
  }

  // Marker um Ostfildern-Zentrum verteilen (kein Geocoding nötig)
  const n = toShow.length;
  toShow.forEach((r, i) => {
    // Spiralförmige Verteilung damit alle sichtbar und anklickbar sind
    const angle = (i / n) * 2 * Math.PI;
    const radius = 0.003 + (Math.floor(i / 8) * 0.002);
    const lat = OSTFILDERN[0] + Math.sin(angle) * radius;
    const lng = OSTFILDERN[1] + Math.cos(angle) * radius * 1.4;

    const color = r._superhost ? '#7A9ADE' : '#C4956A';
    const icon = L.divIcon({
      className: '',
      html: `<div style="background:${color};width:12px;height:12px;border-radius:50%;
        border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4);cursor:pointer"></div>`,
      iconSize: [12, 12], iconAnchor: [6, 6]
    });

    const popup = `
      <strong>${r._name}</strong><br>
      ${r._location}<br>
      ${r._preis ? '<b>' + r._preis + '</b><br>' : ''}
      ${r._superhost ? '<span style="color:#1A3A8B">★ Superhost</span><br>' : ''}
      ${r.URL ? '<a href="' + r.URL + '" target="_blank" rel="noopener">Auf Airbnb ansehen →</a>' : ''}
    `;

    const marker = L.marker([lat, lng], { icon })
      .bindPopup(popup)
      .addTo(markerLayer);
    markers.push({ marker, row: r });
  });

  map.setView(OSTFILDERN, 14);
  hint.textContent = `${n} Inserate · Blau = Superhost · Klicken für Details`;
}

async function loadCSV() {
  const res = await fetch(CSV_FILE);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return parseCSV(await res.text());
}

function parseCSV(raw) {
  const text = raw.charCodeAt(0) === 0xFEFF ? raw.slice(1) : raw;
  const records = [];
  let i = 0, n = text.length;
  while (i < n) {
    const fields = [];
    while (true) {
      let field = '';
      if (text[i] === '"') {
        i++;
        while (i < n) {
          if (text[i] === '"') {
            if (text[i+1] === '"') { field += '"'; i += 2; }
            else { i++; break; }
          } else { field += text[i++]; }
        }
      } else {
        while (i < n && text[i] !== ',' && text[i] !== '\n' && text[i] !== '\r')
          field += text[i++];
      }
      fields.push(field);
      if (i >= n || text[i] === '\n' || text[i] === '\r') break;
      i++;
    }
    if (text[i] === '\r') i++;
    if (text[i] === '\n') i++;
    if (fields.length > 1 || fields[0] !== '') records.push(fields);
  }
  if (records.length < 2) return [];
  const headers = records[0];
  return records.slice(1).map(vals => {
    const obj = {};
    headers.forEach((h, idx) => obj[h.trim()] = (vals[idx] ?? '').trim());
    return obj;
  });
}

function normalizeRow(r) {
  const raw = (r.Preis_pro_Nacht || '');
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l);
  const badge = lines[0] || '';
  const superhost = badge === 'Superhost';
  const locLine = lines.find(l =>
    /^(Wohnung|Zimmer|Unterkunft|Eigentumswohnung|Haus|Bungalow|Ferienwohnung|Suite|Studio) in /i.test(l)
  ) || r.Titel || '';
  const locIdx = lines.indexOf(locLine);
  const name = (locIdx >= 0 && lines[locIdx + 1]) ? lines[locIdx + 1] : r.Titel;
  const cityM = locLine.match(/ in (.+)$/i);
  const city = cityM ? cityM[1].trim() : '';
  const preis = (r.Gesamtpreis || '').replace(/Gesamtpreis/g, '').replace(/ /g, ' ').trim();
  return {
    ...r,
    _name: name || '–',
    _location: locLine,
    _city: city,
    _superhost: superhost,
    _badge: badge,
    _preis: preis,
    _isOstfildern: city.toLowerCase().includes('ostfildern'),
  };
}

function parsePrice(str) {
  if (!str) return null;
  const m = str.replace(/[^\d]/g, '');
  return m ? parseFloat(m) : null;
}

function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  const sh = document.getElementById('superhost-filter').value;
  return allRows.filter(r => {
    if (!r._isOstfildern) return false;
    if (sh === 'ja' && !r._superhost) return false;
    if (q) {
      const hay = [r._name, r._location, r._badge, r._preis].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function sorted(rows) {
  const sel = document.getElementById('sort-select').value;
  if (!sel) return rows;
  return [...rows].sort((a, b) => {
    if (sel === 'preis-asc' || sel === 'preis-desc') {
      const pa = parsePrice(a._preis) ?? Infinity;
      const pb = parsePrice(b._preis) ?? Infinity;
      return sel === 'preis-asc' ? pa - pb : pb - pa;
    }
    if (sel === 'superhost') return (b._superhost ? 1 : 0) - (a._superhost ? 1 : 0);
    return 0;
  });
}

function render() {
  const rows = sorted(filtered());
  document.getElementById('result-count').textContent =
    rows.length + ' Inserat' + (rows.length !== 1 ? 'e' : '');
  if (!rows.length) {
    document.getElementById('cards-view').innerHTML = '';
    document.getElementById('table-body').innerHTML = '';
    showState('Keine Ergebnisse gefunden.');
    return;
  }
  hideState();
  if (currentView === 'cards') renderCards(rows);
  else renderTable(rows);
}

function renderCards(rows) {
  document.getElementById('cards-view').innerHTML = rows.map(r => {
    const badgeCls = r._superhost ? 'pill-super' :
      r._badge.includes('Favorit') ? 'pill-rating' : 'pill-other';
    const badge = r._badge ? `<span class="pill ${badgeCls}">${esc(r._badge)}</span>` : '';
    const preis = r._preis ? `<span class="pill pill-price">${esc(r._preis)}</span>` : '';
    const link = r.URL ? `<a class="card-link" href="${esc(r.URL)}" target="_blank" rel="noopener">Auf Airbnb ansehen →</a>` : '';
    return `<div class="card">
      <div class="card-title">${esc(r._name)}</div>
      <div class="card-sub">${esc(r._location)}</div>
      <div class="card-meta">${preis}${badge}</div>
      ${link}
    </div>`;
  }).join('');
}

function renderTable(rows) {
  document.getElementById('table-head').innerHTML =
    ['Objekt','Standort','Preis','Superhost','Link'].map(l => `<th>${l}</th>`).join('');
  document.getElementById('table-body').innerHTML = rows.map(r => `<tr>
    <td>${esc(r._name)}</td>
    <td>${esc(r._location)}</td>
    <td>${esc(r._preis || '–')}</td>
    <td>${r._superhost ? '✓ Superhost' : '–'}</td>
    <td>${r.URL ? `<a href="${esc(r.URL)}" target="_blank" rel="noopener">Link</a>` : '–'}</td>
  </tr>`).join('');
}

function setView(v) {
  currentView = v;
  document.getElementById('cards-view').style.display = v === 'cards' ? 'grid' : 'none';
  document.getElementById('table-view').style.display = v === 'table' ? 'block' : 'none';
  document.getElementById('btn-cards').classList.toggle('active', v === 'cards');
  document.getElementById('btn-table').classList.toggle('active', v === 'table');
  render();
}

function showState(msg) {
  document.getElementById('state-box').style.display = 'block';
  document.getElementById('state-box').innerHTML = `<div class="icon">&#128193;</div>${msg}`;
  document.getElementById('cards-view').style.display = 'none';
  document.getElementById('table-view').style.display = 'none';
}
function hideState() {
  document.getElementById('state-box').style.display = 'none';
  document.getElementById('cards-view').style.display = currentView === 'cards' ? 'grid' : 'none';
  document.getElementById('table-view').style.display = currentView === 'table' ? 'block' : 'none';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateStats(rows) {
  const ost = rows.filter(r => r._isOstfildern);
  const prices = ost.map(r => parsePrice(r._preis)).filter(p => p !== null);
  const avgPrice = prices.length ? Math.round(prices.reduce((a,b)=>a+b,0)/prices.length) : null;
  const superhosts = ost.filter(r => r._superhost).length;
  document.getElementById('hero-stats').innerHTML = [
    [ost.length, 'Inserate Ostfildern'],
    [rows.length, 'Gesamt geladen'],
    [avgPrice !== null ? avgPrice + ' €' : '–', 'Ø Gesamtpreis'],
    [superhosts, 'Superhosts'],
  ].map(([v,l]) => `<div class="hero-stat"><div class="hero-stat-val">${v}</div><div class="hero-stat-label">${l}</div></div>`).join('');
}

function loadRows(raw) {
  allRows = raw.map(normalizeRow);
}

initMap();

['search','sort-select','superhost-filter'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    loadRows(parseCSV(ev.target.result));
    const ost = allRows.filter(r => r._isOstfildern).length;
    document.getElementById('upload-hint').textContent =
      `${file.name} · ${allRows.length} gesamt · ${ost} in Ostfildern`;
    document.getElementById('hero-sub').textContent = file.name;
    updateStats(allRows);
    render();
    updateMap(allRows);
  };
  reader.readAsText(file, 'utf-8');
});

(async () => {
  try {
    const raw = await loadCSV();
    if (!raw.length) {
      document.getElementById('hero-sub').textContent = 'CSV leer — Workflow ausführen oder Datei hochladen.';
      document.getElementById('hero-stats').innerHTML = '';
      showState('<strong>CSV ist leer.</strong><br><br>Airbnb-Scraper-Workflow starten oder lokale CSV hochladen.');
      return;
    }
    loadRows(raw);
    const ost = allRows.filter(r => r._isOstfildern).length;
    document.getElementById('hero-sub').textContent = `${ost} Inserate in Ostfildern · ${allRows.length} gesamt`;
    document.getElementById('footer').textContent = `Airbnb-Scraper · ${new Date().toLocaleDateString('de-DE')}`;
    updateStats(allRows);
    render();
    updateMap(allRows);
  } catch (e) {
    document.getElementById('hero-sub').textContent = 'Fehler beim Laden.';
    showState(`Fehler: ${e.message}`);
  }
})();
</script>
</body>
</html>
