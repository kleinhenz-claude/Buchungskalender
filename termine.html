*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F5F2EC;
  --surface: #FDFCFA;

  --accent: #8B5E3C;
  --accent-light: #C4956A;
  --text: #1C1A16;
  --text-muted: #7A7469;
  --text-faint: #B0A99F;
  --border: rgba(28,26,22,0.1);
  --radius: 14px;
  --radius-sm: 7px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}

  padding: 3rem 2.5rem 2.75rem;
  position: relative;
  overflow: hidden;
}
.hero-orb1 {
  position: absolute; top: -80px; right: -80px;
  width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(196,149,106,0.18) 0%, transparent 70%);
  pointer-events: none;
}
.hero-orb2 {
  position: absolute; bottom: -50px; left: 60px;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(196,149,106,0.09) 0%, transparent 70%);
  pointer-events: none;
}
.hero-eyebrow {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-light);
  margin-bottom: 0.6rem;
  font-weight: 400;
}
.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 5vw, 3.2rem);
  font-weight: 600;
  line-height: 1.08;
  color: var(--bg);
  margin-bottom: 0.4rem;
}
.hero-sub {

  color: rgba(245,242,236,0.45);

  font-style: italic;

}
.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius);
  overflow: hidden;
  max-width: 700px;
}
.hero-stat {
  background: rgba(255,255,255,0.03);
  padding: 1.25rem 1rem;
  text-align: center;
}
.hero-stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 2.1rem;
  font-weight: 600;
  color: var(--accent-light);
  line-height: 1;
  margin-bottom: 5px;
}
.hero-stat-label {
  font-size: 11px;
  color: rgba(245,242,236,0.42);
  letter-spacing: 0.06em;
  font-weight: 400;
}

/* MAIN */
.main {
  padding: 2.5rem 2.5rem 4rem;
  max-width: 1100px;
  margin: 0 auto;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.25rem;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 14px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* FILTER */
.filter-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 2rem;
}
.filter-bar input[type=search] {
  flex: 1;
  min-width: 200px;
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  outline: none;
}
.filter-bar input[type=search]:focus { border-color: var(--accent-light); }
.filter-bar select {
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  outline: none;
}
.filter-bar select:focus { border-color: var(--accent-light); }
.result-count {
  font-size: 12px;
  color: var(--text-faint);
  margin-left: auto;
}

/* CARDS */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  margin-bottom: 3rem;
}
.event-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.3rem 1.4rem 1.2rem;

  flex-direction: column;
  gap: 10px;
  transition: box-shadow 0.2s, transform 0.2s;
  position: relative;
}
.event-card:hover {
  box-shadow: 0 6px 28px rgba(0,0,0,0.08);

}
.event-card.past {
  opacity: 0.55;
}
.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.card-badges {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.badge {
  font-size: 10px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 20px;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.badge-volksfest  { background: #FEF3E2; color: #92400E; border: 1px solid #FCD34D; }
.badge-stadtfest  { background: #EEF3FE; color: #1A3A8B; border: 1px solid #93C5FD; }
.badge-weihnacht  { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
.badge-weinfest   { background: #F3E8FF; color: #6B21A8; border: 1px solid #C084FC; }
.badge-markt      { background: #ECFDF5; color: #065F46; border: 1px solid #6EE7B7; }
.badge-sport      { background: #F0F9FF; color: #0C4A6E; border: 1px solid #7DD3FC; }
.badge-kultur     { background: #FFF7ED; color: #7C2D12; border: 1px solid #FDBA74; }
.badge-past       { background: var(--surface2); color: var(--text-faint); border: 1px solid var(--border); }
.badge-upcoming   { background: #ECFDF5; color: #065F46; border: 1px solid #6EE7B7; }

.card-name {

  line-height: 1.3;

.card-dates {

.card-desc {

.card-link {

  .filter-bar input { min-width: unset; }
  .result-count { margin-left: 0; }
  #event-map { height: 300px; }

function parseDate(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatDate(s) {
  const d = parseDate(s);
  return d.toLocaleDateString('de-DE', {day:'numeric', month:'short', year:'numeric'});
}

function formatRange(ev) {
  if (ev.start === ev.end) return formatDate(ev.start);
  const s = parseDate(ev.start), e = parseDate(ev.end);
  if (s.getFullYear() === e.getFullYear() && s.getMonth() === e.getMonth()) {
    return `${s.getDate()}. – ${e.toLocaleDateString('de-DE', {day:'numeric', month:'short', year:'numeric'})}`;
  }
  return `${formatDate(ev.start)} – ${formatDate(ev.end)}`;
}

function isPast(ev) {
  return parseDate(ev.end) < TODAY;
}

function isActive(ev) {
  return parseDate(ev.start) <= TODAY && parseDate(ev.end) >= TODAY;
}

  const time = document.getElementById('time-filter').value;

  let rows = EVENTS.filter(ev => {
    if (cat && ev.cat !== cat) return false;
    if (time === 'upcoming' && isPast(ev)) return false;
    if (time === 'past' && !isPast(ev)) return false;
    if (q) {
      const hay = (ev.name + ev.ort + ev.desc + CAT_LABEL[ev.cat]).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // sort: active first, then upcoming by start date, then past by start desc
  rows.sort((a, b) => {
    const aA = isActive(a), bA = isActive(b);
    if (aA && !bA) return -1;
    if (!aA && bA) return 1;
    const aP = isPast(a), bP = isPast(b);
    if (!aP && !bP) return parseDate(a.start) - parseDate(b.start);
    if (aP && bP) return parseDate(b.start) - parseDate(a.start);
    if (!aP && bP) return -1;
    return 1;
  });

  document.getElementById('result-count').textContent =
    `${rows.length} Termin${rows.length !== 1 ? 'e' : ''}`;

  const grid = document.getElementById('cards-grid');
  const state = document.getElementById('state-box');

  if (!rows.length) {
    grid.innerHTML = '';
    state.style.display = '';
    state.textContent = 'Keine Ereignisse gefunden.';
    return;
  }
  state.style.display = 'none';

  grid.innerHTML = rows.map(ev => {
    const past = isPast(ev);
    const active = isActive(ev);
    const statusBadge = active
      ? `<span class="badge badge-upcoming">Läuft jetzt</span>`
      : past
      ? `<span class="badge badge-past">Vergangen</span>`
      : '';
    const distStr = ev.dist === 0 ? 'in Ostfildern' : `ca. ${ev.dist} km`;
    const linkEl = ev.url
      ? `<a class="card-link" href="${ev.url}" target="_blank" rel="noopener">&#8594; Mehr erfahren</a>`
      : '';
    return `
    <div class="event-card${past ? ' past' : ''}">
      <div class="card-top">
        <span class="card-name">${ev.name}</span>
        <div class="card-badges">
          <span class="badge badge-${ev.cat}">${CAT_LABEL[ev.cat]}</span>
          ${statusBadge}
        </div>
      </div>
      <div class="card-dates">${formatRange(ev)}</div>
      <div class="card-location">
        ${ev.ort}
        <span class="dist-tag">${distStr}</span>
      </div>
      <div class="card-desc">${ev.desc}</div>
      ${linkEl}
    </div>`;
  }).join('');

  // hero stats
  const total = EVENTS.length;
  const upcoming = EVENTS.filter(ev => !isPast(ev)).length;
  const cats = new Set(EVENTS.map(e => e.cat)).size;
  const maxDist = Math.max(...EVENTS.map(e => e.dist));
  document.getElementById('hero-stats').innerHTML = `
    <div class="hero-stat"><div class="hero-stat-val">${total}</div><div class="hero-stat-label">Ereignisse</div></div>
    <div class="hero-stat"><div class="hero-stat-val">${upcoming}</div><div class="hero-stat-label">Bevorstehend</div></div>
    <div class="hero-stat"><div class="hero-stat-val">${cats}</div><div class="hero-stat-label">Kategorien</div></div>
    <div class="hero-stat"><div class="hero-stat-val">${maxDist} km</div><div class="hero-stat-label">Max. Entfernung</div></div>
  `;
}

// MAP
const CAT_COLOR = {
  volksfest: '#92400E',
  stadtfest: '#1A3A8B',
  weihnacht: '#991B1B',
  weinfest:  '#6B21A8',
  markt:     '#065F46',
  sport:     '#0C4A6E',
  kultur:    '#7C2D12'
};
const CAT_BG = {
  volksfest: '#FEF3E2',
  stadtfest: '#EEF3FE',
  weihnacht: '#FEE2E2',
  weinfest:  '#F3E8FF',
  markt:     '#ECFDF5',
  sport:     '#F0F9FF',
  kultur:    '#FFF7ED'
};

const eventMap = L.map('event-map', { zoomControl: true }).setView([48.7340, 9.2350], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 18
}).addTo(eventMap);

L.circleMarker([48.7226, 9.2528], {
  radius: 7, color: '#8B5E3C', fillColor: '#C4956A',
  fillOpacity: 1, weight: 2
}).addTo(eventMap).bindTooltip('Ostfildern-Scharnhausen', { permanent: false, direction: 'top' });

let eventMarkers = [];

function makeMarkerIcon(cat, past) {
  const color = past ? '#B0A99F' : CAT_COLOR[cat];
  const bg    = past ? '#EDEBE4' : CAT_BG[cat];
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${bg};border:2.5px solid ${color};box-shadow:0 1px 5px rgba(0,0,0,0.25);"></div>`,
    iconSize: [16, 16], iconAnchor: [8, 8], popupAnchor: [0, -10]
  });
}

function updateMap(rows) {
  eventMarkers.forEach(m => eventMap.removeLayer(m));
  eventMarkers = [];

  rows.forEach(ev => {
    if (!ev.lat || !ev.lng) return;
    const past = isPast(ev), active = isActive(ev);
    const statusHtml = active
      ? `<span style="font-size:10px;color:#065F46;font-weight:500;">Läuft jetzt</span>`
      : past ? `<span style="font-size:10px;color:#B0A99F;">Vergangen</span>` : '';
    const popup = `<div style="min-width:180px;max-width:240px;font-family:'DM Sans',sans-serif;">
      <div class="map-popup-name">${ev.name}</div>
      <div class="map-popup-dates">${formatRange(ev)}</div>
      <div class="map-popup-ort">${ev.ort}</div>
      <span class="map-popup-badge" style="background:${CAT_BG[ev.cat]};color:${CAT_COLOR[ev.cat]};border:1px solid ${CAT_COLOR[ev.cat]}55;">${CAT_LABEL[ev.cat]}</span>
      ${statusHtml ? `&nbsp;${statusHtml}` : ''}
      ${ev.url ? `<div style="margin-top:8px;"><a href="${ev.url}" target="_blank" rel="noopener" style="font-size:11px;color:#C4956A;">→ Mehr erfahren</a></div>` : ''}
    </div>`;
    const marker = L.marker([ev.lat, ev.lng], { icon: makeMarkerIcon(ev.cat, past) })
      .addTo(eventMap).bindPopup(popup);
    eventMarkers.push(marker);
  });

  const cats = [...new Set(rows.map(e => e.cat))];
  document.getElementById('map-legend').innerHTML = cats.map(c =>
    `<span class="legend-item"><span class="legend-dot" style="background:${CAT_BG[c]};border-color:${CAT_COLOR[c]};"></span>${CAT_LABEL[c]}</span>`
  ).join('');
}

let mapVisible = true;
function toggleMap() {
  mapVisible = !mapVisible;
  const col = document.getElementById('map-collapsible');
  const btn = document.getElementById('map-toggle-btn');
  col.style.display = mapVisible ? '' : 'none';
  btn.classList.toggle('active', mapVisible);
  btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 3l5 2 4-2 5 2v10l-5-2-4 2-5-2V3z"/></svg> ${mapVisible ? 'Karte ausblenden' : 'Karte anzeigen'}`;
  if (mapVisible) eventMap.invalidateSize();
}

function render() {
  const q    = document.getElementById('search').value.toLowerCase();
  const cat  = document.getElementById('cat-filter').value;
  const time = document.getElementById('time-filter').value;

  let rows = EVENTS.filter(ev => {
    if (cat && ev.cat !== cat) return false;
    if (time === 'upcoming' && isPast(ev)) return false;
    if (time === 'past' && !isPast(ev)) return false;
    if (q) {
      const hay = (ev.name + ev.ort + ev.desc + CAT_LABEL[ev.cat]).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  rows.sort((a, b) => {
    const aA = isActive(a), bA = isActive(b);
    if (aA && !bA) return -1;
    if (!aA && bA) return 1;
    const aP = isPast(a), bP = isPast(b);
    if (!aP && !bP) return parseDate(a.start) - parseDate(b.start);
    if (aP && bP) return parseDate(b.start) - parseDate(a.start);
    if (!aP && bP) return -1;
    return 1;
  });

  document.getElementById('result-count').textContent =
    `${rows.length} Termin${rows.length !== 1 ? 'e' : ''}`;

  const grid  = document.getElementById('cards-grid');
  const state = document.getElementById('state-box');

  if (!rows.length) {
    grid.innerHTML = '';
    state.style.display = '';
    state.textContent = 'Keine Ereignisse gefunden.';
    updateMap([]);
    return;
  }
  state.style.display = 'none';

  grid.innerHTML = rows.map(ev => {
    const past = isPast(ev), active = isActive(ev);
    const statusBadge = active
      ? `<span class="badge badge-upcoming">Läuft jetzt</span>`
      : past ? `<span class="badge badge-past">Vergangen</span>` : '';
    const distStr = ev.dist === 0 ? 'in Ostfildern' : `ca. ${ev.dist} km`;
    const linkEl  = ev.url
      ? `<a class="card-link" href="${ev.url}" target="_blank" rel="noopener">&#8594; Mehr erfahren</a>`
      : '';
    return `
    <div class="event-card${past ? ' past' : ''}">
      <div class="card-top">
        <span class="card-name">${ev.name}</span>
        <div class="card-badges">
          <span class="badge badge-${ev.cat}">${CAT_LABEL[ev.cat]}</span>
          ${statusBadge}
        </div>
      </div>
      <div class="card-dates">${formatRange(ev)}</div>
      <div class="card-location">${ev.ort}<span class="dist-tag">${distStr}</span></div>
      <div class="card-desc">${ev.desc}</div>
      ${linkEl}
    </div>`;
  }).join('');

  const total    = EVENTS.length;
  const upcoming = EVENTS.filter(ev => !isPast(ev)).length;
  const cats     = new Set(EVENTS.map(e => e.cat)).size;
  const maxDist  = Math.max(...EVENTS.map(e => e.dist));
  document.getElementById('hero-stats').innerHTML = `
    <div class="hero-stat"><div class="hero-stat-val">${total}</div><div class="hero-stat-label">Ereignisse</div></div>
    <div class="hero-stat"><div class="hero-stat-val">${upcoming}</div><div class="hero-stat-label">Bevorstehend</div></div>
    <div class="hero-stat"><div class="hero-stat-val">${cats}</div><div class="hero-stat-label">Kategorien</div></div>
    <div class="hero-stat"><div class="hero-stat-val">${maxDist} km</div><div class="hero-stat-label">Max. Entfernung</div></div>
  `;

  updateMap(rows);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('cat-filter').addEventListener('change', render);
document.getElementById('time-filter').addEventListener('change', render);

render();
</script>
